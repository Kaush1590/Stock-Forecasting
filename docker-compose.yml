services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./outputs:/app/outputs:ro
    environment:
      ARTIFACT_DIR: /app/outputs
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
